<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartChat AI - AI Assistant</title>

    <meta
        name="description"
        content="Ask anything with SmartChat AI. Fast, smart and free AI assistant."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            🤖 SmartChat AI
        </div>

        <button
            class="theme-btn"
            type="button"
            title="Theme"
        >
            🌙
        </button>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">


        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >
                ➕ New Chat
            </button>


            <div class="chat-history">

                <h3>
                    Recent Chats
                </h3>

                <ul id="historyList">
                </ul>

            </div>

        </aside>


        <!-- =========================
             MAIN WORKSPACE
        ========================== -->

        <main class="main-workspace">


            <!-- CHAT AREA -->

            <div
                class="chat-area"
                id="chatArea"
            >

                <div
                    class="messages"
                    id="messages"
                >

                    <div class="message ai-message">

                        <h2>
                            👋 Welcome to SmartChat AI
                        </h2>

                        <p>
                            Hello! Ask me anything.
                        </p>

                    </div>

                </div>

            </div>


            <!-- =========================
                 INPUT AREA
            ========================== -->

            <div class="input-area">

                <form
                    id="chatForm"
                    class="chat-form"
                >


                    <!-- MESSAGE INPUT -->

                    <textarea
                        id="userInput"
                        name="message"
                        placeholder="Type your message..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>


                    <!-- BUTTONS -->

                    <div class="input-buttons">


                        <!-- 🎤 VOICE -->

                        <button
                            type="button"
                            id="voiceBtn"
                            class="icon-btn"
                            title="Voice Input"
                            aria-label="Voice Input"
                        >
                            🎤
                        </button>


                        <!-- 🌐 WEB SEARCH -->

                        <button
                            type="button"
                            id="webSearchBtn"
                            class="icon-btn web-btn"
                            title="Live Web Search"
                            aria-label="Live Web Search"
                        >
                            🌐
                        </button>


                        <!-- SEND -->

                        <button
                            type="submit"
                            id="sendBtn"
                            class="send-btn"
                        >
                            Send ➜
                        </button>

                    </div>

                </form>

            </div>

        </main>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 SmartChat AI. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
