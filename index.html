<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartChat AI - AI Assistant</title>
    <meta name="description" content="Ask anything with SmartChat AI. Fast, smart and free AI assistant.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            🤖 SmartChat AI
        </div>
        <button class="theme-btn">
            🌙
        </button>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="new-chat-btn" id="newChatBtn">
                ➕ New Chat
            </button>

            <div class="chat-history">

    <h3>Recent Chats</h3>

    <ul id="historyList">
    </ul>

</div>
        </aside>

        <!-- Main Workspace (Chat Area + Input) -->
        <main class="main-workspace">
            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="message ai-message">
                        <h2>👋 Welcome to SmartChat AI</h2>
                        <p>Hello! Ask me anything.</p>
                    </div>
                </div>
            </div>

            <!-- Input Area inside Workspace -->
            <div class="input-area">
                <textarea id="userInput" placeholder="Type your message..."></textarea>
                <button id="sendBtn">Send ➜</button>
            </div>
        </main>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 SmartChat AI. All Rights Reserved.</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
