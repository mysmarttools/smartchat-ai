<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AISmartChat – Best Free AI Chat Assistant</title>
    <meta name="description" content="AISmartChat is a free AI chat assistant.">
    <link rel="canonical" href="https://aismartchat.vercel.app/">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">🤖 SmartChat AI</div>
        <button class="theme-btn">🌙</button>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="new-chat-btn" id="newChatBtn">➕ New Chat</button>
            <div class="chat-history">
                <h3>Recent Chats</h3>
                <ul id="historyList"></ul>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <div class="chat-area" id="chatArea">
                <div class="messages" id="messages">
                    <div class="message ai-message">
                        <h2>👋 Welcome to SmartChat AI</h2>
                        <p>Hello! Ask me anything.</p>
                    </div>
                </div>
            </div>

            <!-- Mobile-Optimized Input Form -->
            <form class="input-area" id="chatForm">
                <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
                <button type="submit" id="sendBtn">Send ➜</button>
            </form>
        </main>

    </div>

    <footer>
        <p>© 2026 SmartChat AI. All Rights Reserved.</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
